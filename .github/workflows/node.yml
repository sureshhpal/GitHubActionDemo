name: My First GitHub Action

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Display Node Version
        run: node --version

      - name: Install Packages
        run: npm install

      - name: Display Message
        run: echo "Congratulations! GitHub Action is Running Successfully."